
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #09091a, #20204a);
    }

    .calculator {
      width: 320px;
      padding: 22px;
      border-radius: 20px;
      background: #151528;
      box-shadow: 0 0 30px #6c4dff55;
    }

    h2 {
      color: #8c7bff;
      text-align: center;
    }

    #display {
      width: 100%;
      height: 65px;
      margin-bottom: 15px;
      padding: 12px;
      border: 2px solid #454568;
      border-radius: 10px;
      background: #09091a;
      color: white;
      font-size: 26px;
      text-align: right;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 55px;
      border: none;
      border-radius: 12px;
      background: #292947;
      color: white;
      font-size: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #6553db;
      transform: scale(1.04);
    }

    .operator {
      background: #493b91;
    }

    .clear {
      background: #d94367;
    }

    .equal {
      background: #16a085;
      grid-column: span 2;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <h2>⚡ Neon Calculator</h2>

    <input id="display" value="0" readonly>

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="removeLast()">⌫</button>
      <button class="operator" onclick="add('/')">÷</button>
      <button class="operator" onclick="add('*')">×</button>

      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button class="operator" onclick="add('-')">−</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button class="operator" onclick="add('+')">+</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button onclick="add('.')">.</button>

      <button class="zero" onclick="add('0')">0</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    let expression = "";

    function add(value) {
      if (expression === "Error") expression = "";
      expression += value;
      display.value = expression;
    }

    function clearDisplay() {
      expression = "";
      display.value = "0";
    }

    function removeLast() {
      expression = expression === "Error"
        ? ""
        : expression.slice(0, -1);
      display.value = expression || "0";
    }

    function calculate() {
      try {
        if (!expression ||
            !/^[0-9+\-*/.() ]+$/.test(expression)) {
          return;
        }

        const result = Function(
          '"use strict"; return (' + expression + ')'
        )();

        if (!Number.isFinite(result)) {
          throw new Error("Invalid calculation");
        }

        expression = String(
          Number(result.toPrecision(12))
        );
        display.value = expression;
      } catch {
        expression = "Error";
        display.value = expression;
      }
    }
  </script>
</body>
</html>
